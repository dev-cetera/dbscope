<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!--
    Maskable variant of dbscope_icon.svg for the PWA manifest: the background
    bleeds to every edge (the platform applies its own mask) and the monogram
    is scaled to 85% so it stays inside the safe zone. Keep the shapes in sync
    with dbscope_icon.svg.
  -->
  <rect width="1024" height="1024" fill="#E5452B"/>
  <g transform="translate(76.8 76.8) scale(0.85)">
    <rect x="468" y="236" width="88" height="578" rx="14" fill="#FFF2DC"/>
    <circle cx="342" cy="600" r="170" fill="none" stroke="#FFF2DC" stroke-width="88"/>
    <circle cx="342" cy="600" r="42" fill="#FFF2DC"/>
    <circle cx="682" cy="600" r="170" fill="none" stroke="#FFF2DC" stroke-width="88"/>
  </g>
</svg>
