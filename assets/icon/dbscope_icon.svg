<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- background -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3E76A8"/>
      <stop offset="1" stop-color="#16344F"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.35" r="0.6">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <!-- microscope body -->
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2E5077"/>
      <stop offset="0.55" stop-color="#1F3D5D"/>
      <stop offset="1" stop-color="#1A3450"/>
    </linearGradient>
    <linearGradient id="navyV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#35597F"/>
      <stop offset="1" stop-color="#152C44"/>
    </linearGradient>
    <linearGradient id="tube" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.45" stop-color="#E8F0F7"/>
      <stop offset="1" stop-color="#AEC3D6"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF3C4" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#FFF3C4" stop-opacity="0.06"/>
    </linearGradient>
    <!-- sheet -->
    <linearGradient id="sheet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#D9E6F2"/>
    </linearGradient>
    <linearGradient id="header" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4380B5"/>
      <stop offset="1" stop-color="#336791"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1024" height="1024" rx="230" fill="url(#bg)"/>
  <rect x="0" y="0" width="1024" height="1024" rx="230" fill="url(#glow)"/>

  <!-- ground shadow -->
  <ellipse cx="512" cy="928" rx="340" ry="28" fill="#0A1A2A" opacity="0.35"/>

  <!-- ===== microscope (drawn behind the sheet) ===== -->
  <!-- arm -->
  <path d="M 630 660 C 690 560 690 430 583 377" fill="none" stroke="url(#navyV)"
        stroke-width="66" stroke-linecap="round"/>
  <!-- focus knob -->
  <circle cx="683" cy="487" r="46" fill="#13293F"/>
  <circle cx="683" cy="487" r="46" fill="url(#navy)"/>
  <circle cx="683" cy="487" r="20" fill="#4E7BA6"/>
  <circle cx="671" cy="474" r="9" fill="#8FB4D4" opacity="0.8"/>
  <!-- base -->
  <rect x="350" y="645" width="360" height="66" rx="30" fill="url(#navyV)"/>
  <rect x="366" y="645" width="328" height="14" rx="7" fill="#4E7BA6" opacity="0.55"/>

  <!-- tilted optics group -->
  <g transform="rotate(12 500 400)">
    <!-- eyepiece -->
    <rect x="466" y="132" width="78" height="84" rx="18" fill="url(#navy)"/>
    <rect x="478" y="144" width="18" height="60" rx="9" fill="#4E7BA6" opacity="0.45"/>
    <!-- main tube -->
    <rect x="443" y="196" width="124" height="278" rx="52" fill="url(#tube)"/>
    <!-- objective housing -->
    <path d="M 462 466 L 548 466 L 532 540 L 478 540 Z" fill="url(#navy)"/>
    <!-- lens -->
    <ellipse cx="505" cy="543" rx="22" ry="9" fill="#9FE0FF"/>
  </g>

  <!-- ===== spreadsheet (in front, below) ===== -->
  <!-- thickness -->
  <polygon points="168,912 856,912 856,932 168,932" fill="#1C3B58"/>
  <!-- top face -->
  <polygon points="272,672 752,672 856,912 168,912" fill="url(#sheet)"/>
  <!-- header row -->
  <polygon points="272,672 752,672 768,710 256,710" fill="url(#header)"/>
  <!-- highlighted cell (beam target) -->
  <polygon points="373,760 512,760 512,811 362,811" fill="#FFE9A8"/>
  <!-- grid lines -->
  <g stroke="#9DBBD4" stroke-width="4" fill="none">
    <line x1="392" y1="672" x2="340" y2="912"/>
    <line x1="512" y1="672" x2="512" y2="912"/>
    <line x1="632" y1="672" x2="684" y2="912"/>
    <line x1="256" y1="710" x2="768" y2="710"/>
    <line x1="234" y1="760" x2="790" y2="760"/>
    <line x1="212" y1="811" x2="812" y2="811"/>
    <line x1="190" y1="862" x2="834" y2="862"/>
  </g>

  <!-- light beam from lens to highlighted cell, cast along the tube axis -->
  <polygon points="460,540 489,546 511,815 322,815" fill="url(#beam)"/>
</svg>
