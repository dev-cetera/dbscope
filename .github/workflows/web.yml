# Builds the web app and deploys it to Firebase Hosting (dbscope-prod, see
# firebase.json / .firebaserc) on every push to main that touches app code.
#
# Auth is keyless Workload Identity Federation: GitHub's OIDC token for this
# repo on main is exchanged for a short-lived token of the github-deploy
# service account (role: Firebase Hosting Admin). No key is stored anywhere.
# Needs two repository *variables* (not secrets, nothing in them is
# sensitive), set up by scripts/setup_firebase_deploy.sh:
#   GCP_WIF_PROVIDER  projects/<number>/locations/global/workloadIdentityPools/github/providers/github
#   GCP_DEPLOY_SA     github-deploy@dbscope-prod.iam.gserviceaccount.com
# Without them the build still runs and the deploy is skipped.
name: Web

on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'packages/**'
      - 'web/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'firebase.json'
      - '.fvmrc'
      - '.github/workflows/web.yml'
  workflow_dispatch:

concurrency:
  group: web-deploy
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CAN_DEPLOY: ${{ vars.GCP_WIF_PROVIDER != '' && vars.GCP_DEPLOY_SA != '' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4

      - name: Read Flutter version from .fvmrc
        id: fvm
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm.outputs.version }}
          channel: stable
          cache: true

      - run: flutter pub get

      # Each deploy keeps the pubspec version and bumps the build number, so
      # open tabs see a strictly newer version.json and offer "Refresh"
      # (lib/update/update_service.dart). The build lives under /b/<run>/ so
      # no browser cache can pin an old main.dart.js (stage_web_build.sh).
      - name: Build (version-stamped)
        run: |
          NAME="$(sed -n 's/^version: *\([0-9.]*\).*/\1/p' pubspec.yaml)"
          BUILD="${{ github.run_number }}"
          echo "Building dbscope $NAME+$BUILD"
          flutter build web --release --build-name "$NAME" --build-number "$BUILD" \
            --base-href "/b/$BUILD/" --dart-define=APP_VERSION="$NAME+$BUILD"
          bash scripts/stage_web_build.sh build/web "$BUILD"
          cat build/web/version.json

      - name: Check the build boots
        run: |
          python3 -m http.server 8787 --bind 127.0.0.1 --directory build/web >/dev/null 2>&1 &
          sleep 1
          bash scripts/check_web_boots.sh http://127.0.0.1:8787/

      - name: Authenticate to Google Cloud
        if: env.CAN_DEPLOY == 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - name: Deploy to Firebase Hosting
        if: env.CAN_DEPLOY == 'true'
        run: npx --yes firebase-tools@14.22.0 deploy --only hosting --project dbscope-prod --non-interactive

      - name: Check the live site boots
        if: env.CAN_DEPLOY == 'true'
        run: bash scripts/check_web_boots.sh https://dbscope-prod.web.app/

      - name: Deploy skipped
        if: env.CAN_DEPLOY != 'true'
        run: echo "::warning::GCP_WIF_PROVIDER / GCP_DEPLOY_SA repository variables are not set; built but did not deploy."
