# Builds the web app and deploys it to Firebase Hosting (dbscope-prod, see
# firebase.json / .firebaserc) on every push to main that touches app code.
# Needs the FIREBASE_SERVICE_ACCOUNT secret (JSON key of a service account
# with the "Firebase Hosting Admin" role); without it the build still runs
# but the deploy step is skipped.
name: Web

on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'packages/**'
      - 'web/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'firebase.json'
      - '.fvmrc'
      - '.github/workflows/web.yml'
  workflow_dispatch:

concurrency:
  group: web-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HAS_FIREBASE: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Read Flutter version from .fvmrc
        id: fvm
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm.outputs.version }}
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter build web --release

      - name: Deploy to Firebase Hosting
        if: env.HAS_FIREBASE == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: dbscope-prod
          channelId: live

      - name: Deploy skipped
        if: env.HAS_FIREBASE != 'true'
        run: echo "::warning::FIREBASE_SERVICE_ACCOUNT is not set; built but did not deploy."
