<!DOCTYPE html>
<html>
<head>
  <!--
    Replaced by `flutter build web --base-href`. Deploys build into a
    per-deploy folder (/b/<run>/, see scripts/stage_web_build.sh) so every
    script and asset URL is new on each deploy and no browser cache can pin
    an old build.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="dbscope: an open-source database viewer and editor for Postgres and SQLite, with an AI assistant that writes SQL.">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="dbscope">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>dbscope</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body { margin: 0; height: 100%; background: #1e1e1e; }
    #boot {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px;
      font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #cccccc; text-align: center; padding: 0 16px;
    }
    #boot img { width: 64px; height: 64px; }
    #boot .bar { width: 160px; height: 3px; background: #333; border-radius: 2px; overflow: hidden; }
    #boot .bar::after {
      content: ""; display: block; width: 40%; height: 100%; background: #0e639c;
      animation: boot-slide 1.1s ease-in-out infinite;
    }
    @keyframes boot-slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
    #boot button {
      font: inherit; color: #fff; background: #0e639c; border: 0;
      padding: 6px 14px; border-radius: 2px; cursor: pointer;
    }
    #boot pre { max-width: min(640px, 100%); white-space: pre-wrap; color: #f48771; font-size: 12px; }
  </style>
</head>
<body>
  <!-- Shown until Flutter paints its first frame. If startup throws first,
       it turns into an error with a Reload button instead of a blank page. -->
  <div id="boot">
    <img src="icons/Icon-192.png" alt="">
    <div class="bar"></div>
  </div>
  <script>
    (function () {
      var boot = document.getElementById('boot');
      var started = false;
      window.addEventListener('flutter-first-frame', function () {
        started = true;
        boot.remove();
      });
      function fail(message) {
        if (started || !boot.isConnected) return;
        started = true;
        boot.innerHTML = '';
        var title = document.createElement('div');
        title.textContent = 'dbscope failed to start.';
        var detail = document.createElement('pre');
        detail.textContent = String(message || 'Unknown error');
        var reload = document.createElement('button');
        reload.textContent = 'Reload';
        reload.onclick = function () { location.reload(); };
        boot.append(title, detail, reload);
      }
      window.addEventListener('error', function (e) {
        fail(e.error && e.error.message ? e.error.message : e.message);
      });
      window.addEventListener('unhandledrejection', function (e) {
        fail(e.reason && e.reason.message ? e.reason.message : e.reason);
      });
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
