# The strict analyzer bar for every Dart package in this repo.
#
# dbscope is its own repo: this is a copy of the strict bar used by compledo
# (compledo/analysis_options.yaml). Packages under packages/ include it.
#
# How this list was built (2026-10-12): every rule the Dart linter ships
# (https://dart.dev/tools/linter-rules/all) is listed below, on or off. The
# baseline is very_good_analysis, the strictest widely used curated set, plus
# the remaining official rules that do not contradict another rule or a
# documented house convention. Every rule that is OFF says why (the
# house conventions cited are compledo's, which dbscope follows).
#
# Listing rules as `name: true/false` (never the `- name` list form) keeps one
# merge style, so a package file can switch a single rule off.

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

  exclude:
    - "**/build/**"
    # Generated code is the generator's responsibility; its template, not the
    # output, is what to fix. Generated files still type-check as imports.
    - "**/*.g.dart"
    - "**/generated_plugin_registrant.dart"
    - build/**
    - web/**
    - macos/**

  errors:
    always_declare_return_types: error
    avoid_renaming_method_parameters: error
    avoid_type_to_string: error
    close_sinks: error
    collection_methods_unrelated_type: error
    depend_on_referenced_packages: error
    flutter_style_todos: error
    invalid_override_of_non_virtual_member: error
    invalid_use_of_protected_member: error
    missing_required_param: error
    missing_return: error
    no_leading_underscores_for_local_identifiers: error
    prefer_final_in_for_each: error
    prefer_relative_imports: error
    record_literal_one_positional_no_trailing_comma: error
    unnecessary_new: error
    unrelated_type_equality_checks: error
    use_key_in_widget_constructors: error
    # Labels are used as named section markers in long init sequences
    # (service_manager.dart, init_app.dart); they are never jump targets.
    unused_label: ignore

formatter:
  trailing_commas: preserve
  page_width: 100

linter:
  rules:
    # ── OFF: contradicts a rule that is ON ────────────────────────────────────
    always_specify_types: false # vs omit_local_variable_types / omit_obvious_property_types
    always_use_package_imports: false # vs prefer_relative_imports (house rule)
    omit_obvious_local_variable_types: false # superseded by omit_local_variable_types
    prefer_double_quotes: false # vs prefer_single_quotes (house rule)
    specify_nonobvious_local_variable_types: false # vs omit_local_variable_types
    unnecessary_final: false # vs prefer_final_locals

    # ── OFF: contradicts a documented house convention ────────────────────────
    # Enum values and registry constants are UPPER_SNAKE_CASE, mirroring the
    # stored string (dart_style.md).
    constant_identifier_names: false
    non_constant_identifier_names: false
    # Registries are `abstract final class` catalogues of static constants.
    avoid_classes_with_only_static_members: false
    # The house bans `late` (dart-discipline.md); this rule asks for more.
    use_late_for_private_fields_and_variables: false
    # Doubles are written with an explicit `.0` (dart_style.md).
    prefer_int_literals: false
    # Private State classes are returned from public createState().
    library_private_types_in_public_api: false
    # Local typed closures are allowed where they read better.
    prefer_function_declarations_over_variables: false
    # Flutter's `{super.key, required this.x}` idiom puts key first.
    always_put_required_named_parameters_first: false
    # Fires on the `'text' '||translation-key'` localization idiom and on
    # multi-line SQL fragments, where no space is wanted.
    missing_whitespace_between_adjacent_strings: false

    # ── OFF: cost with no defect caught ───────────────────────────────────────
    # App code, not a published library: comment where the WHY is not obvious,
    # not on every public member.
    public_member_api_docs: false
    # `dart format` owns line width (the site formats at 120).
    lines_longer_than_80_chars: false
    always_put_control_body_on_new_line: false
    # debugFillProperties boilerplate on every widget.
    diagnostic_describe_all_properties: false
    # Catch-alls in offline/replay paths deliberately catch Errors too; an
    # `on Object` on every one is ceremony.
    avoid_catches_without_on_clauses: false
    # build() and service skeletons are block bodies (pattern_catalogue.md).
    prefer_expression_function_bodies: false
    # strict-inference demands an explicit `dynamic` where inference fails.
    avoid_annotating_with_dynamic: false
    # Single-method interfaces exist so tests can inject fakes.
    # Only meaningful for single-entrypoint scripts.
    unreachable_from_main: false
    # The analyzer rejects it alongside omit_obvious_property_types (the user-
    # requested rule); specify_nonobvious_property_types covers what is left.
    type_annotate_public_apis: false
    # Not in very_good_analysis: Container → DecoratedBox is not always equal.
    use_decorated_box: false
    # Fires on sequential registrations (`router.post(...)` x38 in one routes
    # file); a 38-link cascade reads worse than 38 statements.
    cascade_invocations: false
    # Dropping `async` from a body with no `await` turns a failed Future into
    # a synchronous throw, which changes behaviour for every non-awaiting caller.
    unnecessary_async: false

    # ── ON ────────────────────────────────────────────────────────────────────
    always_declare_return_types: true
    annotate_overrides: true
    annotate_redeclares: true
    avoid_bool_literals_in_conditional_expressions: true
    avoid_catching_errors: true
    avoid_double_and_int_checks: true
    avoid_dynamic_calls: true
    avoid_empty_else: true
    avoid_equals_and_hash_code_on_mutable_classes: true
    avoid_escaping_inner_quotes: true
    avoid_field_initializers_in_const_classes: true
    avoid_final_parameters: true
    avoid_function_literals_in_foreach_calls: true
    avoid_futureor_void: true
    avoid_implementing_value_types: true
    avoid_init_to_null: true
    avoid_js_rounded_ints: true
    avoid_multiple_declarations_per_line: true
    avoid_positional_boolean_parameters: true
    avoid_print: true
    avoid_redundant_argument_values: true
    avoid_relative_lib_imports: true
    avoid_renaming_method_parameters: true
    avoid_return_types_on_setters: true
    avoid_returning_null_for_void: true
    avoid_returning_this: true
    avoid_setters_without_getters: true
    avoid_shadowing_type_parameters: true
    avoid_single_cascade_in_expression_statements: true
    avoid_slow_async_io: true
    avoid_type_to_string: true
    avoid_types_as_parameter_names: true
    avoid_types_on_closure_parameters: true
    avoid_unnecessary_containers: true
    avoid_unused_constructor_parameters: true
    avoid_void_async: true
    avoid_web_libraries_in_flutter: true
    await_only_futures: true
    camel_case_extensions: true
    camel_case_types: true
    cancel_subscriptions: true
    cast_nullable_to_non_nullable: true
    close_sinks: true
    collection_methods_unrelated_type: true
    combinators_ordering: true
    comment_references: true
    conditional_uri_does_not_exist: true
    control_flow_in_finally: true
    curly_braces_in_flow_control_structures: true
    dangling_library_doc_comments: true
    depend_on_referenced_packages: true
    deprecated_consistency: true
    deprecated_member_use_from_same_package: true
    directives_ordering: true
    discarded_futures: true
    # `fromEnvironment` reads live in one EnvConfig per package and nowhere
    # else (dart_style.md); that file carries the one documented ignore.
    do_not_use_environment: true
    document_ignores: true
    empty_catches: true
    empty_constructor_bodies: true
    empty_statements: true
    eol_at_end_of_file: true
    exhaustive_cases: true
    file_names: true
    flutter_style_todos: true
    hash_and_equals: true
    implementation_imports: true
    implicit_call_tearoffs: true
    implicit_reopen: true
    invalid_case_patterns: true
    invalid_runtime_check_with_js_interop_types: true
    join_return_with_assignment: true
    leading_newlines_in_multiline_strings: true
    library_annotations: true
    library_names: true
    library_prefixes: true
    literal_only_boolean_expressions: true
    matching_super_parameters: true
    missing_code_block_language_in_doc_comment: true
    no_adjacent_strings_in_list: true
    no_default_cases: true
    no_duplicate_case_values: true
    no_leading_underscores_for_library_prefixes: true
    no_leading_underscores_for_local_identifiers: true
    no_literal_bool_comparisons: true
    no_logic_in_create_state: true
